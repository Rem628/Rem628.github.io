<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大学数学题库 · 在线版</title>
<link rel="stylesheet" href="app.css?v=20261031a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#1B3B6F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="数学题库">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16">
<script>
if ('serviceWorker' in navigator) {
  addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js');
  });
}
</script>
</head>
<body>
<div id="login-status" style="position:fixed;top:12px;left:0;right:0;text-align:center;color:#86909c;font-size:13px;z-index:9"></div>
<header>
  <h1>大学数学题库</h1>
  <div class="sub">东北大学《大学数学网络学习平台》题库整理 · 登录后在手机、电脑间同步刷题进度</div>
</header>

<!-- 登录 / 注册 -->
<div id="authview" style="display:none">
  <div class="authbox">
    <h2 id="a-title">登录</h2>
    <div class="lead" id="a-lead">用邮箱和密码继续刷题</div>
    <div class="tabs">
      <button id="tab-login" class="on" onclick="switchTab('login')">登录</button>
      <button id="tab-reg" onclick="switchTab('reg')">注册</button>
    </div>

    <div id="quicklogin" style="display:none;margin-bottom:12px;padding:10px 12px;background:#eaf2ff;border:1px solid #bcdaff;border-radius:8px">
      <div style="font-size:12.5px;color:#4e5969;margin-bottom:8px">上次登录：<b id="ql-email"></b></div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn primary" style="flex:1;padding:9px" onclick="quickLogin()">⚡ 一键登录</button>
        <button class="btn linkish" style="padding:9px 6px" onclick="forgetMe()">清除</button>
      </div>
    </div>

    <div class="field">
      <label>邮箱</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    </div>

    <div class="field" id="f-pass">
      <label>密码</label>
      <input type="password" id="password" placeholder="至少 6 位" autocomplete="current-password">
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:#4e5969;cursor:pointer;margin-top:8px">
        <input type="checkbox" id="remember" checked style="width:15px;height:15px;margin:0;flex:none">记住密码，下次一键登录
      </label>
      <div style="font-size:11.5px;color:#86909c;margin-top:4px">密码只保存在本机浏览器里，用于免输登录</div>
    </div>

    <div class="field" id="f-code" style="display:none">
      <label>邮箱验证码</label>
      <div class="row2">
        <input type="text" id="code" placeholder="6 位验证码">
        <button class="btn" style="flex:none;white-space:nowrap" id="btn-send" onclick="sendCode()">获取验证码</button>
      </div>
      <div class="err" id="e-code"></div>
    </div>

    <div class="err" id="e-msg"></div>

    <div style="margin-top:16px;display:flex;gap:8px;align-items:center">
      <button class="btn primary" style="flex:1;padding:10px" id="btn-go" onclick="submitAuth()">登录</button>
    </div>

    <div style="margin-top:12px;text-align:right">
      <button class="btn linkish" onclick="startReset()">忘记密码？</button>
    </div>
  </div>
</div>

<!-- 已登录：题库首页 -->
<div id="appview" style="display:none">
  <div class="wrap">
    <div class="banner info" id="who"></div>
    <div style="margin:0 0 12px;padding:10px 12px;background:#fffbe6;border:1px solid #ffe58f;border-radius:8px;font-size:13px;color:#614700">
      <b>从旧版迁移数据：</b>
      <input type="file" id="imp-file" accept=".json" style="font-size:12px;vertical-align:middle">
      <span id="imp-msg"></span>
    </div>
    <div style="margin:14px 0;display:flex;gap:8px;flex-wrap:wrap">
      <a class="btn" href="exam.html" style="border-color:#165dff;color:#165dff">📝 模拟练习</a>
      <a class="btn" href="review.html">📄 回看试卷</a>
      <a class="btn" href="fav.html" style="border-color:#f7a825;color:#a5670d">★ 我的收藏夹</a>
      <a class="btn" href="admin.html" id="adminbtn" style="display:none">⚙ 管理后台</a>
      <button class="btn" onclick="changePw()">修改密码</button>
      <button class="btn" onclick="doSignOut()">退出登录</button>
      <span class="score" id="syncstate" style="margin-left:auto">—</span>
    <button class="btn" onclick="manualRefresh(this)" title="推送本地进度并拉取云端最新数据">↻ 刷新</button>
    </div>
    <div id="courses"></div>
    <div class="banner warn" style="margin-top:18px">
      答题进度会自动保存到云端，换设备登录同一个账号即可继续。
      题目右上角 ☆ 可收藏，收藏夹里集中练习。
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="meta.js?v=20261031a"></script>
<script src="app.js?v=20261101a"></script>
<script src="fav_seed.js?v=20261101a"></script>
<script>/* 单人模式：Supabase 固定账号自动登录（登录 UI 已隐藏） */
(async () => {
  const show = (m) => { const el = document.getElementById("login-status"); if (el) el.textContent = m; };
  try {
    if (typeof supabase === "undefined") throw new Error("supabase-js 未加载");
    initCloud();
    const showApp = () => {
      const av = document.getElementById("authview");
      const ap = document.getElementById("appview");
      if (av) av.style.display = "none";
      if (ap) ap.style.display = "";
      const el = document.getElementById("login-status");
      if (el) el.remove();
    };
    let { data } = await supa.auth.getSession();
    if (data && data.session) {
      // 已有会话：显示主视图 + 渲染科目卡片
      showApp();
      fillWho(data.session.user);
      restoreFavSeed();
      renderCourses();
      return;
    }
    show("正在登录…");
    let resp = await supa.auth.signInWithPassword({ email: SUPA_CFG.email, password: SUPA_CFG.password });
    if (resp.error) {
      const r3 = await supa.auth.signUp({ email: SUPA_CFG.email, password: SUPA_CFG.password });
      if (r3.error) throw r3.error;
    }
    showApp();
    fillWho((await supa.auth.getSession()).data.session.user);
    restoreFavSeed();
    renderCourses();
    show("登录成功，进入题库…");
  } catch (e) {
    show("登录失败：" + String(e.message || e).slice(0, 90) + "（请检查 app.js 顶部 SUPA_CFG 配置）");
  }
})();
document.addEventListener("change", (e) => {
  if (e.target && e.target.id === "imp-file" && e.target.files[0]) importOldData(e.target.files[0]);
});
function fillWho(user) {
  const email = (user && user.email) || (user && user.id) || "已登录";
  const who = document.getElementById("who");
  if (who) who.textContent = "当前账号：" + email;
}
function restoreFavSeed() {
  // 收藏恢复：当前 fav 为空且内置种子存在（旧站数据无法跨域名读取，用记录恢复）
  try {
    if (!Array.isArray(fav) || fav.length || typeof FAV_SEED === "undefined") return;
    fav = FAV_SEED.slice();
    touchFav(); saveLocal(); scheduleSync();
    console.log("[迁移] 已恢复收藏 " + fav.length + " 条（来自旧版记录）");
    const m = document.getElementById("imp-msg");
    if (m) m.textContent = "已自动恢复收藏 " + fav.length + " 条";
  } catch (e) {}
}
function importOldData(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      let moved = 0;
      ["NEU-REC:", "NEU-FAV:", "NEU-EXAMS:", "NEU-EXDEL:", "NEU-RECDEL:", "NEU-FAVT:"].forEach((p) => {
        for (const key in data) {
          if (key.indexOf(p) === 0) { localStorage.setItem(key, data[key]); moved++; }
        }
      });
      const m = document.getElementById("imp-msg");
      if (m) m.textContent = "导入完成（" + moved + " 项），即将刷新…";
      setTimeout(() => location.reload(), 1200);
    } catch (e) {
      const m = document.getElementById("imp-msg");
      if (m) m.textContent = "导入失败：" + e.message;
    }
  };
  reader.readAsText(file);
}
function renderCourses() {
  const box = document.getElementById("courses");
  const M = window.META || {};
  let html = "";
  for (const tk of Object.keys(M)) {
    const v = M[tk];
    const total = v.chapters.reduce((s, c) => s + c.total, 0);
    let chips = "";
    v.chapters.forEach((c, i) => {
      const cls = c.name.indexOf("填空与计算") >= 0 ? " chip-new" : "";
      chips += '<a class="chip' + cls + '" href="ch.html?tk=' + tk + "&c=" + i + '">'
        + c.name + " <b>" + c.total + "</b> 题</a>";
    });
    html += '<div class="tk-card"><div class="tk-head"><span class="tk-name">' + v.name
      + '</span><span class="tk-count">共 ' + total + " 题 · " + v.chapters.length
      + ' 章</span></div><div class="chips">' + chips + "</div></div>";
  }
  box.innerHTML = html;
}</script>
</body>
</html>
