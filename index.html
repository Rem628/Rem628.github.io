<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>大学数学题库</title>
<link rel="stylesheet" href="app.css?v=20261102b"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1B3B6F"><link rel="icon" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script></head><body>
<header><h1>大学数学题库</h1><div class="sub">东北大学题库整理 · 本地保存学习记录 · 登录后跨设备同步</div></header>
<section id="authview" hidden class="authbox" aria-labelledby="a-title"><h2 id="a-title">首次登录</h2><p>使用原来的云同步账号。登录一次后，应用会自动保持登录。</p>
<form onsubmit="submitAuth(event)"><div class="field"><label for="email">邮箱</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required></div><p id="e-msg" class="err" role="alert"></p><button id="btn-go" type="submit" class="btn primary">登录并开启自动同步</button> <button type="button" class="btn" onclick="document.getElementById('authview').hidden=true">先在本机练习</button></form></section>
<main id="appview" class="wrap"><div class="banner info" id="who">正在读取本机记录…</div><div class="toolbar" style="margin:14px 0"><a class="btn" href="exam.html">模拟练习</a><a class="btn" href="review.html">回看试卷</a><a class="btn" href="fav.html">我的收藏夹</a><button class="btn" onclick="showLogin()">登录／切换账号</button><button id="signout" class="btn" hidden onclick="doSignOut()">退出登录</button><button class="btn" onclick="manualRefresh(this)">同步刷新</button><span id="syncstate" role="status">本地记录可用</span></div>
<details class="banner info"><summary>数据备份与旧版迁移</summary><p>更换网址或应用后，本地记录不会自动跨地址迁移。请使用原账号同步，或从旧版导出 JSON 后导入。导出文件不包含密码和登录凭据。</p><div class="toolbar"><button class="btn" onclick="exportBackup()">导出全部本机记录</button><button class="btn" onclick="restoreBeforeImport()">导出上次导入前备份</button></div><p><label for="imp-file">导入备份文件</label> <input type="file" id="imp-file" accept=".json,application/json"></p><p id="imp-msg" role="status"></p><div id="import-confirm" hidden><label for="import-account">来源账号</label><select id="import-account"></select><button class="btn primary" onclick="confirmImport()">合并到当前账号</button></div><div class="toolbar"><button class="btn" onclick="importLocalLegacy()">合并本机离线／旧版记录</button><button class="btn" onclick="restoreFavSeed()">恢复内置旧收藏（一次）</button></div></details>
<div id="courses"></div><div class="banner warn">作答会先保存在本机。请关注同步状态，并定期导出备份。浏览器离线时可使用已缓存内容；新版 APK 还内置了题库资源。</div></main><div id="toast" class="toast" role="status"></div>
<script src="vendor/supabase.js"></script><script src="meta.js?v=20261102b"></script><script src="app.js?v=20261102b"></script><script src="fav_seed.js?v=20261102b"></script><script src="data-tools.js?v=20261102b"></script><script src="home.js?v=20261102b"></script></body></html>
