<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>章节练习</title>
<link rel="stylesheet" href="app.css?v=20261102b">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#1B3B6F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="数学题库">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16">
<script>
if ('serviceWorker' in navigator) {
  addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</head>
<body>
<header>
  <div class="headbar">
    <span class="hb-title" id="hb-title">—</span>
    <span class="hb-prog" id="hb-prog"></span>
    <button class="nav-toggle" onclick="toggleNav()">☰ 目录</button>
    <button class="hb-fold" id="foldbtn" onclick="toggleHead()">▾ 展开</button>
  </div>
  <div id="headmore">
  <div class="breadcrumb">
    <a href="index.html">题库首页</a> › <span id="bc-tk"></span> › <span id="bc-ch"></span>
  </div>
  <h1 id="title">—</h1>
  <div class="sub" id="sub">—</div>
  <div class="toolbar">
    <input type="search" id="kw" placeholder="在本章内搜索知识点…">
    <input type="number" id="jumpno" placeholder="题号" min="1">
    <button class="btn" onclick="jumpToNo()">跳转</button>
    <span class="score" id="score">已答 <b>0</b>/0　正确率 <b>0%</b></span>
    <button class="btn" onclick="toggleCram(this)">背题模式</button>
    <button class="btn" onclick="toggleWrong(this)">只看错题</button>
    <button class="btn" onclick="toggleFavFilter(this)">只看收藏</button>
    <button class="btn" onclick="resetAll()"
            title="只清除当前显示题目的作答记录">重置当前</button>
    <a class="btn" href="fav.html">★ 收藏夹</a>
    <a class="btn" href="index.html">← 目录</a>
    <span class="score" id="syncstate" style="margin-left:auto">—</span>
    <button class="btn" onclick="manualRefresh(this)" title="推送本地进度并拉取云端最新数据">↻ 刷新</button>
  </div>
  </div>
  <div id="navbox">
    <div class="groupbar">
      <span style="font-size:12.5px;color:#86909c;align-self:center">本章切换：</span>
      <span id="chsw"></span>
    </div>
    <div class="groupbar">
      <span style="font-size:12.5px;color:#86909c;align-self:center">题组：</span>
      <span id="kpbtns"></span>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="empty" id="empty" style="display:none">没有符合条件的题目，换个筛选试试。</div>
  <div id="list"></div>
</div>

<div class="toast" id="toast"></div>

<script src="vendor/supabase.js"></script>
<script src="meta.js?v=20261102b"></script>
<script src="app.js?v=20261102b"></script>
<script>
const QS = new URLSearchParams(location.search);
const TK = (QS.get("tk") || "GS").toUpperCase();
const CI = parseInt(QS.get("c") || "0", 10);
let chapter = null, cache = null;

// 只加载本章的题，不加载整库（整库 8MB 且服务器不压缩，手机上首屏会卡十几秒）
// 弱网下偶发失败：自动重试三次，重试时带时间戳绕开可能的坏缓存
function loadChapterData() {
  const once = (bust) => new Promise((res) => {
    if(!window.META?.[TK]?.chapters[CI]){res(false);return;}
    const s = document.createElement("script");
    const timer=setTimeout(()=>{s.remove();res(false)},15000);
    s.src = "q_" + TK + "_" + CI + ".js?v=" + (window.MB_VER || "1") + (bust ? "&r=" + Date.now() : "");
    s.onload = () => {clearTimeout(timer);res(true);};
    s.onerror = () => {clearTimeout(timer);s.remove();res(false);};
    document.head.appendChild(s);
  });
  return (async () => {
    for (let i = 0; i < 3; i++) {
      if (await once(i > 0)) return true;
      await new Promise((r) => setTimeout(r, 600 * (i + 1)));
    }
    return false;
  })();
}

function esc2(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function buildCache() {
  if (cache) return cache;
  const meta = (window.META || {})[TK];
  if (!meta || !meta.chapters[CI]) return null;
  chapter = meta.chapters[CI];
  const all = Object.keys(window.QDATA || {}).map((k) => window.QDATA[k]);
  const inCh = all.filter((q) => q.tk === TK && q.ch === chapter.name);
  // 每个知识点内按「抓取序号」排序 = 平台原始顺序，与离线版完全一致
  // （qid 是哈希值，按它排序会打乱成随机顺序；也不要依赖 JS 对象的键顺序）
  const byKp = {};
  inCh.forEach((q) => { (byKp[q.kpid] = byKp[q.kpid] || []).push(q); });
  Object.keys(byKp).forEach((k) => byKp[k].sort((a, b) => (a.i || 0) - (b.i || 0)));
  cache = { byKp };
  return cache;
}

function renderChapter() {
  if (!buildCache()) return;
  const box = document.getElementById("list");
  let html = "", gi = 0;
  chapter.kps.forEach((kp) => {
    const list = cache.byKp[kp.id] || [];
    if (!list.length) return;
    html += '<div class="kp-block" data-kp="' + kp.id + '">'
      + '<div class="kp-title">' + esc2(kp.name)
      + ' <span style="font-weight:400;color:#86909c">（' + list.length + ' 题）</span></div>';
    list.forEach((q) => { gi++; html += qHTML(q, gi, "c" + CI); });
    html += "</div>";
  });
  box.innerHTML = html;

  // 章节切换
  const meta = window.META[TK];
  let sw = "";
  meta.chapters.forEach((c, i) => {
    sw += '<a class="btn" href="ch.html?tk=' + TK + "&c=" + i + '"'
      + (i === CI ? ' style="border-color:#165dff;color:#165dff"' : "") + ">" + esc2(c.name) + "</a> ";
  });
  document.getElementById("chsw").innerHTML = sw;

  // 题组按钮
  let btns = "";
  chapter.kps.forEach((kp) => {
    const n = (cache.byKp[kp.id] || []).length;
    if (!n) return;
    btns += '<button class="gbtn" data-kp="' + kp.id + '" onclick="pickKp(this,\'' + kp.id + '\')">'
      + esc2(kp.name) + ' <span class="n">0/' + n + "</span></button>";
  });
  document.getElementById("kpbtns").innerHTML = btns;

  document.title = chapter.name + " · 练习";
  document.getElementById("title").textContent = chapter.name;
  document.getElementById("hb-title").textContent = chapter.name;
  document.getElementById("bc-tk").textContent = meta.name;
  document.getElementById("bc-ch").textContent = chapter.name;
  document.getElementById("sub").textContent =
    meta.name + " · 本章 " + chapter.total + " 题 · " + chapter.kps.length + " 个知识点组";
}

window.addEventListener("DOMContentLoaded", async () => {
  const loaded = await loadChapterData();
  if (!loaded) {
    document.getElementById("list").innerHTML =
      '<div class="empty">题库加载失败，请检查网络后<a href="javascript:location.reload()">重试</a>。</div>';
    return;
  }
  if (!buildCache()) {
    document.getElementById("list").innerHTML =
      '<div class="empty">参数有误，请从<a href="index.html">首页</a>重新进入。</div>';
    return;
  }
  bindCommonControls();
  await bootPage(renderChapter);
});

function toggleHead() {
  const m = document.getElementById("headmore");
  const btn = document.getElementById("foldbtn");
  const closed = m.classList.toggle("fold-closed");
  btn.textContent = closed ? "▾ 展开" : "▴ 收起";
  document.body.classList.toggle("head-open", !closed);
}

(function initHead() {
  const narrow = window.innerWidth <= 768;
  const m = document.getElementById("headmore");
  const btn = document.getElementById("foldbtn");
  if (narrow) {
    m.classList.add("fold-closed");
    btn.textContent = "▾ 展开";
  } else {
    btn.textContent = "▴ 收起";
    document.body.classList.add("head-open");
  }
  const scoreEl = document.getElementById("score");
  const hbProg = document.getElementById("hb-prog");
  const sync = () => {
    const n = scoreEl.textContent.match(/(\d+)\s*\/\s*(\d+)/) || [];
    const p = scoreEl.textContent.match(/正确率\s*(\d+)/) || [];
    hbProg.textContent = (n[1] ? n[1] + "/" + n[2] : "") + (p[1] ? " · " + p[1] + "%" : "");
  };
  new MutationObserver(sync).observe(scoreEl, { childList: true, subtree: true, characterData: true });
  sync();
})();
</script>
</body>
</html>
