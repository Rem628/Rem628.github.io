<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>回看试卷</title>
<link rel="stylesheet" href="app.css?v=20261031a">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B3B6F">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<script>
if ('serviceWorker' in navigator) {
  addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });
}
</script>
</head>
<body>
<header>
  <div class="breadcrumb"><a href="index.html">题库首页</a> › 回看试卷</div>
  <h1>📄 回看试卷</h1>
  <div class="sub">模拟练习的历史成绩与试卷，点击任意一份进入复习（含答案与解析）</div>
  <div class="toolbar">
    <a class="btn" href="exam.html">📝 再来一套模拟练习</a>
    <a class="btn" href="index.html">← 返回目录</a>
  </div>
</header>
<div class="wrap">
  <div class="empty" id="empty" style="display:none">
    还没有做过模拟练习。<br>到<a href="exam.html">模拟练习</a>里完成一套试卷，成绩就会出现在这里。
  </div>
  <div id="list"></div>
</div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="qmap.js?v=20261031a"></script>
<script src="meta.js?v=20261031a"></script>
<script src="app.js?v=20261031a"></script>
<script>
function render() {
  const M = window.META || {};   // 科目名映射（此前漏定义，有试卷时渲染直接抛错导致列表空白）
  const box = document.getElementById("list");
  if (!exams.length) {
    document.getElementById("empty").style.display = "block";
    box.innerHTML = "";
    return;
  }
  box.innerHTML = exams.map((e) => {
    const grade = e.graded ? (e.pending ? "待自评" : "已判分") : "未交卷";
    return '<div class="tk-card" style="cursor:pointer" onclick="location.href=\'exam.html?review=' + e.id + '\'">'
      + '<div class="tk-head"><span class="tk-name">' + (M[e.tk] ? M[e.tk].name : e.sub)
      + ' · 模拟卷</span><span class="tag">' + grade + "</span>"
      + '<button class="btn" style="margin-left:auto;padding:5px 12px;font-size:12.5px;color:#d03050;border-color:#f5b3bf"'
      + ' onclick="delExam(event,\'' + e.id + '\')">删除</button></div>'
      + '<div style="font-size:13px;color:#4e5969;margin-top:4px">'
      + new Date(e.ts).toLocaleString() + " · " + e.qids.length + " 题 · 得分 <b style=\"color:#165dff\">"
      + e.score + "</b>/" + e.total + "</div></div>";
  }).join("");
}
/* 删除一条试卷记录：本地移除 + 墓碑标记同步，云端那份不会复活 */
function delExam(ev, id) {
  ev.stopPropagation();
  if (!confirm("删除这份试卷的记录？\n（题目和刷题进度不受影响，删除后不可恢复）")) return;
  deleteExam(id);
  render();
  toast("已删除");
}
window.addEventListener("DOMContentLoaded", async () => {
  if (await checkUpdate()) return;
  const s = await requireLogin();
  if (!s) return;
  loadForUser(s);
  try { await pullState(); } catch (e) {}
  render();
});
</script>
</body>
</html>
