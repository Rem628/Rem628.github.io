<script>
const QS = new URLSearchParams(location.search);
const M = window.META || {};
/* 与官方「在线练习」实测一致的配比：线代 19 选择 + 3 填空 + 1 计算 = 23 题；高数纯选择 25 题 */
const EXAM_TOTAL = { GS: 25, XD: 23 };
let state = { tk: null, questions: [], exam: null, readonly: false };

/* ---------- 视图切换 ---------- */
function showView(v) {
  document.getElementById("view-setup").style.display = v === "setup" ? "" : "none";
  document.getElementById("view-paper").style.display = v === "paper" ? "" : "none";
}

/* ---------- 第一步：科目 ---------- */
function buildSubjects() {
  const box = document.getElementById("subjkart");
  const pick = ["GS", "XD"].filter((k) => M[k]);
  box.innerHTML = pick.map((k) =>
    '<button class="btn" onclick="pickSubject(\'' + k + '\')">' + M[k].name + "（" +
    M[k].chapters.reduce((a, c) => a + c.total, 0) + " 题）</button>").join("");
}
function pickSubject(tk) {
  state.tk = tk;
  const isXD = tk === "XD";
  const totalQ = EXAM_TOTAL[tk];
  document.getElementById("mixinfo").textContent = isXD
    ? "官方配比：选择题 19 + 填空题 3 + 计算题 1 = 23 题（满分 " + totalQ * 4 + "）"
    : "官方配比：纯选择题 " + totalQ + " 道（满分 " + totalQ * 4 + "）";
  const box = document.getElementById("treebox");
  let html = "";
  M[tk].chapters.forEach((ch, ci) => {
    html += '<div class="tr-ch"><label><input type="checkbox" class="ck-ch" checked data-ci="' + ci + '">'
      + ch.name + "（" + ch.total + " 题）</label></div>";
    html += '<div class="tr-kp" data-ci="' + ci + '">'
      + ch.kps.map((k) =>
          '<label><input type="checkbox" class="ck-kp" checked data-kp="' + k.id + '" data-ci="' + ci + '">'
          + k.name + "</label>").join("")
      + "</div>";
  });
  box.innerHTML = html;
  box.addEventListener("change", treeChange);
  document.getElementById("setup1").style.display = "none";
  document.getElementById("setup2").style.display = "";
}
function treeChange(e) {
  const t = e.target;
  if (t.classList.contains("ck-ch")) {
    document.querySelectorAll('.ck-kp[data-ci="' + t.dataset.ci + '"]')
      .forEach((k) => { k.checked = t.checked; });
  }
}
function checkAll(on) {
  document.querySelectorAll("#treebox input").forEach((i) => { i.checked = on; });
}

/* ---------- 加载勾选章节的题目切片 ---------- */
function loadScript(src) {
  return new Promise((res) => {
    const timeout=setTimeout(()=>{s.remove();res(false)},15000);
    const s = document.createElement("script");
    s.src = src + (src.indexOf("?") >= 0 ? "&" : "?") + "v=" + (window.MB_VER || "1");
    s.onload = () => {clearTimeout(timeout);res(true);};
    s.onerror = () => {clearTimeout(timeout);s.remove();res(false);};
    document.head.appendChild(s);
  });
}

/* ---------- 平均抽题：名额轮流分给各知识点组，组内随机 ---------- */
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function drawUniform(groups, n) {
  const gs = groups.map((g) => shuffle(g.slice()));
  const out = [];
  let i = 0;
  while (out.length < n && gs.some((g) => g.length)) {
    const g = gs[i % gs.length];
    if (g.length) out.push(g.pop());
    i++;
  }
  return out;
}

/* ---------- 第二步：组卷 ---------- */
async function startExam() {
  if(state.loading)return;state.loading=true;
  try {
  const kps = [...document.querySelectorAll(".ck-kp")].filter((k) => k.checked);
  if (!kps.length) { toast("至少勾选一个知识点"); return; }
  const cis = [...new Set(kps.map((k) => k.dataset.ci))];
  toast("正在加载题目…");
  for (const ci of cis) {
    const ok = await loadScript("q_" + state.tk + "_" + ci + ".js");
    if (!ok) { toast("题库加载失败，请检查网络"); return; }
  }
  const chosen = new Set(kps.map((k) => k.dataset.kp));
  const pool = Object.values(window.QDATA || {}).filter(
    (q) => q.tk === state.tk && chosen.has(q.kpid));

  const choice = pool.filter((q) => qType(q) !== "calc");
  const blank  = pool.filter((q) => qType(q) === "calc" && q.tag === "填空");
  const calc   = pool.filter((q) => qType(q) === "calc" && q.tag === "计算");


  // 官方实测配比：线代 19 选择 + 3 填空 + 1 计算 = 23 题；高数纯选择 25 道。
  // 某类题库存不足时名额让给选择题
  const totalQ = EXAM_TOTAL[state.tk];
  let nCalc = 0, nBlank = 0, nChoice = totalQ;
  if (state.tk === "XD") {
    nCalc = Math.min(1, calc.length);
    nBlank = Math.min(3, blank.length);
    nChoice = totalQ - nCalc - nBlank;
    if (choice.length < nChoice) { toast("所选范围选择题不足，请多勾选"); return; }
  } else if (choice.length < totalQ) {
    toast("所选范围题目不足 " + totalQ + " 道，请多勾选一些章节"); return;
  }

  const qs = [
    ...drawUniform([choice], nChoice),
    ...drawUniform([blank], nBlank),
    ...drawUniform([calc], nCalc),
  ];
  state.questions = qs;
  state.exam = {
    id: "E" + Date.now(),
    tk: state.tk,
    ts: Date.now(),
    sub: M[state.tk].name,
    qids: qs.map((q) => q.q),
    ans: {},
    score: 0,
    right: 0,
    pending: 0,
    graded: false,
    total: qs.length * 4,
  };
  saveDraft();renderPaper(false);
  } finally {state.loading=false;}
}

/* ---------- 渲染试卷 ---------- */
function renderPaper(readonly) {
  const ex = state.exam;
  state.readonly=readonly;
  const isXD = ex.tk === "XD";
  document.getElementById("p-head").textContent =
    (readonly ? "回看试卷 · " : "模拟试卷 · ") + ex.sub;
  document.getElementById("p-sub").textContent =
    new Date(ex.ts).toLocaleString() + " · 共 " + ex.qids.length + " 题 · 每题 4 分";
  document.getElementById("btn-submit").style.display = readonly ? "none" : "";
  document.getElementById("btn-submit2").style.display = readonly ? "none" : "";
  const parts = [[isXD ? "一、选择题" : "一、选择题", (q) => qType(q) !== "calc"]];
  if (isXD) {
    parts.push(["二、填空题", (q) => qType(q) === "calc" && q.tag === "填空"]);
    parts.push(["三、计算题", (q) => qType(q) === "calc" && q.tag === "计算"]);
  }
  let html = "", i = 0;
  const chosen = new Set(ex.qids);
  state.questions = ex.qids.map(id=>(window.QDATA||{})[id]).filter(Boolean);
  parts.forEach(([title, filter]) => {
    const list = state.questions.filter(filter);
    if (!list.length) return;
    html += '<div class="part-title">' + title + "</div>";
    list.forEach((q) => { i++; html += qHTML(q, i, "ex"); });
  });
  document.getElementById("runlist").innerHTML = html;
  updateScorebox();
  showView("paper");
  // 交卷前隐藏「查看答案解析」，防止提前偷看；交卷后恢复
  document.querySelectorAll("#runlist .peek").forEach((p) => {
    p.style.display = (!readonly && !ex.graded) ? "none" : "";
  });
  // 注意：这里绝不能调用 paintAll()——那会把你在正常练习里的历史作答状态
  // 画进试卷里（绿勾红叉+锁死+弹解析）。模拟卷是全新作答，只排版公式。
  // 回看/已交卷状态按试卷自己的答案（exam.ans）回显，见下方分支。
  typesetMath(document.body);
  syncFavBtns();
  document.querySelectorAll("#runlist .self-eval").forEach(el=>el.style.display=ex.graded?"":"none");
  document.querySelectorAll("#runlist .multi-submit,#runlist .blank-box button").forEach(el=>el.style.display="none");
  if(!readonly&&!ex.graded){
    document.querySelectorAll('#runlist .q').forEach(el=>{
      const a=ex.ans[el.dataset.qid]||'';
      el.querySelectorAll('input[type=radio],input[type=checkbox]').forEach(i=>i.checked=a.includes(i.value));
      const input=el.querySelector('.blank-in');if(input)input.value=a;
    });
  }
  // 回显已作答（回看模式）
  if (readonly || ex.graded) {
    document.querySelectorAll("#runlist .q").forEach((el) => {
      const qid = el.getAttribute("data-qid");
      const u = ex.ans[qid];
      if (el.dataset.type !== "calc" || (u != null && u !== "")) paintAnswered(el, u || "");
      else if (el.getAttribute("data-type") === "calc") {
        const why = el.querySelector(".why");
        if (why) why.classList.add("show");
      }
    });
    updateScorebox();
    if (ex.graded) showScoreCard();
    document.getElementById("p-title").textContent = readonly ? "回看" : (ex.graded ? "已交卷" : "答题");
  }
}
function updateScorebox() {
  document.getElementById("scorebox").innerHTML =
    "得分 <b>" + state.exam.score + "</b>/" + state.exam.total;
}
function showScoreCard() {
  const ex = state.exam;
  const box = document.getElementById("scorecard");
  box.style.display = "";
  box.innerHTML = '<div class="big">' + ex.score + " 分</div>"
    + '<div style="color:#4e5969;font-size:13.5px;margin-top:4px">满分 ' + ex.total
    + " · 答对 " + ex.right + " / " + ex.qids.length + " 题"
    + (ex.pending > 0 ? " · 待自评 " + ex.pending + " 道主观题" : " · 已完成判分")
    + '</div><div style="font-size:12.5px;color:#86909c;margin-top:6px">成绩已存入「回看试卷」，可随时复习</div>';
}

/* ---------- 收集答案与判分 ---------- */
function collect(el) {
  const type = el.getAttribute("data-type");
  if (type === "calc") return null;
  if (type === "blank") {
    const i = el.querySelector(".blank-in");
    return i ? i.value.trim() : "";
  }
  if (type === "multi") {
    const p = [];
    el.querySelectorAll("input:checked").forEach((b) => p.push(b.value));
    return p.sort().join("");
  }
  const c = el.querySelector("input:checked");
  return c ? c.value : "";
}
function judge(el, user) {
  const ans = el.getAttribute("data-ans") || "";
  const type = el.getAttribute("data-type");
  if (type === "calc") return null;
  if (type === "blank") return user !== "" && normTxt(user) === normTxt(ans);
  return user !== "" && user === ans;
}
function submitExam() {
  if(!state.exam || state.exam.graded)return;
  const els = [...document.querySelectorAll("#runlist .q")];
  let unanswered = 0;
  els.forEach((el) => {
    if (el.getAttribute("data-type") === "calc") return;
    if (!collect(el)) unanswered++;
  });
  if (unanswered && !confirm("还有 " + unanswered + " 题未作答（按 0 分计），确定交卷吗？")) return;
  // 先收集答案并立刻落库——即使后面判分渲染出错，这份试卷也一定在「回看试卷」里
  els.forEach((el) => {
    const u = collect(el);
    state.exam.ans[el.getAttribute("data-qid")] = u == null ? "" : u;
  });
  state.exam.graded = true;
  localStorage.removeItem("NEU-DRAFT:"+_ukey);
  document.querySelectorAll("#runlist .self-eval").forEach(el=>el.style.display="");
  saveExam();
  let score = 0, right = 0, pending = 0;
  try {
    els.forEach((el) => {
      const qid = el.getAttribute("data-qid");
      const u = state.exam.ans[qid];
      const j = judge(el, u);
      if (j === null) {
        pending++;
        const why = el.querySelector(".why");
        if (why) why.classList.add("show");
        return;
      }
      if (j) { score += 4; right++; }
      paintAnswered(el, u);
    });
  } catch (err) {
    toast("试卷已保存，但成绩展示出错：" + (err.message || "未知错误"));
  }
  state.exam.score = score;
  state.exam.right = right;
  state.exam.pending = pending;
  document.getElementById("btn-submit").style.display = "none";
  document.getElementById("btn-submit2").style.display = "none";
  document.querySelectorAll("#runlist .peek").forEach((p) => { p.style.display = ""; });
  showScoreCard();
  updateScorebox();
  saveExam();
  window.scrollTo({ top: 0, behavior: "smooth" });
  toast(pending ? "交卷成功，请对主观题自评" : "交卷成功");
}
/* 主观题（线代计算）自评：官方为 12 分/题的大题，本卷按用户规则折算 4 分 */
function examSelf(btn, ok) {
  if(!state.exam?.graded){toast("请先交卷，再对照解析自评");return;}
  const el = btn.closest(".q");
  const qid = el.getAttribute("data-qid");
  state.exam.ans[qid] = ok ? "ok" : "no";
  el.querySelectorAll(".self-eval .btn").forEach((b) => { b.disabled = true; });
  btn.classList.add(ok ? "self-ok" : "self-no");
  const fb = el.querySelector(".fb");
  if (fb) {
    fb.className = "fb " + (ok ? "ok" : "no");
    fb.textContent = ok ? "✓ 自评：得 4 分" : "✗ 自评：不得分";
  }
  let score = 0, right = 0, pending = 0;
  document.querySelectorAll("#runlist .q").forEach((e2) => {
    const t = e2.getAttribute("data-type");
    const qid = e2.getAttribute("data-qid");
    const a = state.exam.ans[qid];
    if (t === "calc") {
      if (a === "ok") { score += 4; right++; } else if (a !== "no") pending++;
      return;
    }
    if (a && answerCorrect(e2.dataset.type,a,e2.dataset.ans)) { score += 4; right++; }
  });
  state.exam.score = score;
  state.exam.right = right;
  state.exam.pending = pending;
  state.exam.graded = true;
  updateScorebox();
  showScoreCard();
  saveExam();
}

/* ---------- 试卷保存与同步 ---------- */
function saveExam() {
  state.exam.updatedAt=Date.now();
  const i = exams.findIndex((e) => e.id === state.exam.id);
  if (i >= 0) exams[i] = state.exam; else exams.unshift(state.exam);
  saveLocal();
  syncExams();   // 同步函数在 app.js（回看页删除记录也用它）
}

function saveDraft(){
  if(!state.exam||state.exam.graded)return;
  document.querySelectorAll('#runlist .q').forEach(el=>{const a=collect(el);if(a!==null)state.exam.ans[el.dataset.qid]=a;});
  try{localStorage.setItem('NEU-DRAFT:'+_ukey,JSON.stringify(state.exam));}catch(e){toast('试卷草稿保存失败，请勿关闭页面并尽快交卷');}
}
document.addEventListener('input',saveDraft);document.addEventListener('change',saveDraft);window.addEventListener('pagehide',saveDraft);
/* ---------- 启动 ---------- */
window.addEventListener("DOMContentLoaded", async () => {
  bindCommonControls();
  const rid = QS.get("review");
  if (rid) {
    // 回看模式：从本机（必要时云端）找试卷
    const s = await requireLogin();
    if (!s) return;
    loadForUser(s);
    if(!exams.some(e=>e.id===rid)){try{await pullState();}catch(e){}}
    const ex = exams.find((e) => e.id === rid);
    if (!ex) {
      document.getElementById("view-setup").style.display = "none";
      document.getElementById("view-paper").style.display = "";
      document.getElementById("runlist").innerHTML =
        '<div class="empty">未找到这份试卷，<a href="review.html">返回回看列表</a>。</div>';
      return;
    }
    state.exam = ex;
    state.tk = ex.tk;
    const need = [...new Set(ex.qids.map((qid) => (window.QMAP || {})[qid]).filter(Boolean))];
    for (const name of need) {
      if(!await loadScript('q_'+name+'.js')){showView('paper');document.getElementById('runlist').innerHTML='<p class="banner warn">试卷题目加载失败，请联网后刷新重试。原记录未改变。</p>';return;}
    }
    if(ex.qids.some(id=>!window.QDATA?.[id])){showView('paper');document.getElementById('runlist').textContent='部分题目无法匹配，原试卷已保留，请导出备份后检查。';return;}
    renderPaper(true);
    return;
  }
  const s = await requireLogin();
  if (!s) return;
  loadForUser(s);
  buildSubjects();
  const draft=_read('NEU-DRAFT:'+_ukey,null);
  if(draft&&validExam(draft)&&!draft.graded){
    const banner=document.createElement('div');banner.className='banner info';banner.textContent='有一份未完成的模拟卷。';
    const resume=document.createElement('button');resume.className='btn';resume.textContent='继续上次练习';
    resume.onclick=async()=>{resume.disabled=true;try{const names=[...new Set(draft.qids.map(id=>window.QMAP[id]).filter(Boolean))];for(const name of names)if(!await loadScript('q_'+name+'.js'))throw Error('题目加载失败');if(draft.qids.some(id=>!window.QDATA?.[id]))throw Error('部分题目无法匹配');state.exam=draft;state.tk=draft.tk;renderPaper(false);}catch(e){toast(e.message);}finally{resume.disabled=false;}};
    banner.appendChild(resume);document.getElementById('setup1').prepend(banner);
  }
});
</script>
</body>
</html>
